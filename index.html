<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正在跳转...</title>

  <!-- 方式 1：Meta 刷新（0 秒无缝跳转，兼容无 JS 环境） -->
  <meta http-equiv="refresh" content="0; url=https://availability-pickup-rip-paradise.trycloudflare.com">

  <script>
    // 方式 2：JS 强制跳转（replace 不会把跳转页压入历史记录，避免后退死循环）
    window.location.replace("https://availability-pickup-rip-paradise.trycloudflare.com");
  </script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      color: #555;
      background-color: #fafafa;
    }
    a {
      color: #0066cc;
      text-decoration: none;
      margin-top: 8px;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <p>页面正在跳转中，请稍候...</p>
  <p>如果没有自动跳转，请<a href="https://availability-pickup-rip-paradise.trycloudflare.com">点击这里</a>。</p>
</body>
</html>
