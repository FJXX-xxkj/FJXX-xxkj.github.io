<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>复古未来主义电报机 · 3D 互动模型</title>
  <style>
    :root {
      --ink: #162235;
      --muted: #637184;
      --line: rgba(35, 52, 73, 0.14);
      --cyan: #4fc3f7;
      --paper: rgba(248, 251, 253, 0.86);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      color: var(--ink);
      background:
        radial-gradient(circle at 48% 36%, #ffffff 0, #f3f6f8 34%, #dfe6eb 72%, #cfd8df 100%);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(26, 42, 60, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(26, 42, 60, 0.025) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.55), transparent 72%);
    }

    #scene {
      position: fixed;
      inset: 0;
    }

    #scene canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      touch-action: none;
    }

    .message-display {
      position: fixed;
      left: 50%;
      bottom: 28px;
      z-index: 10;
      max-width: calc(100vw - 40px);
      transform: translateX(-50%);
      pointer-events: none;
    }

    #signalText {
      display: block;
      max-width: calc(100vw - 40px);
      overflow: hidden;
      color: #101f31;
      font: 700 clamp(28px, 4vw, 50px)/1.15 Georgia, "Times New Roman", serif;
      letter-spacing: 0.18em;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-shadow:
        0 1px 2px rgba(255, 255, 255, 0.95),
        0 0 24px rgba(245, 250, 255, 0.95);
    }

    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 20;
      background: #e8edf1;
      color: #586a7d;
      font-size: 13px;
      letter-spacing: 0.08em;
      transition: opacity 350ms ease, visibility 350ms ease;
    }

    #loading.hidden {
      opacity: 0;
      visibility: hidden;
    }

    #loading.error {
      color: #8b2e35;
      white-space: pre-wrap;
      text-align: center;
      padding: 30px;
      line-height: 1.8;
    }

    @media (max-width: 720px) {
      .message-display {
        bottom: 18px;
        max-width: calc(100vw - 24px);
      }

      #signalText {
        max-width: calc(100vw - 24px);
        font-size: clamp(24px, 8vw, 38px);
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main id="scene" aria-label="固定主视角的三维电报机模型"></main>

  <div class="message-display" aria-live="polite">
    <span id="signalText"></span>
  </div>

  <div id="loading">正在初始化三维电报机…</div>

  <script type="module">
    import * as THREE from "three";
    import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

    const loading = document.querySelector("#loading");
    const signalText = document.querySelector("#signalText");
    const sceneHost = document.querySelector("#scene");

    try {
      // -----------------------------------------------------------------------
      // 场景初始化
      // -----------------------------------------------------------------------
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
        powerPreference: "high-performance",
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.08;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      sceneHost.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.fog = new THREE.Fog(0xdde6ec, 96, 168);

      const camera = new THREE.PerspectiveCamera(
        36,
        window.innerWidth / window.innerHeight,
        0.5,
        220
      );
      camera.position.set(0, 19, 52);
      camera.lookAt(0, 10.2, -0.5);
      renderer.domElement.style.cursor = "default";

      const pmrem = new THREE.PMREMGenerator(renderer);
      const roomEnvironment = new RoomEnvironment();
      scene.environment = pmrem.fromScene(roomEnvironment, 0.04).texture;
      roomEnvironment.dispose();
      pmrem.dispose();

      const clock = new THREE.Clock();
      const device = new THREE.Group();
      scene.add(device);

      const C = {
        shell: 0xc8cdd3,
        shellLight: 0xdce1e5,
        shellDark: 0x959da6,
        charcoal: 0x3a3f47,
        frame: 0x22262c,
        screen: 0x4fc3f7,
      };

      const materials = {
        shell: new THREE.MeshStandardMaterial({
          color: C.shell,
          metalness: 0.3,
          roughness: 0.5,
        }),
        shellLight: new THREE.MeshStandardMaterial({
          color: C.shellLight,
          metalness: 0.24,
          roughness: 0.46,
        }),
        shellDark: new THREE.MeshStandardMaterial({
          color: C.shellDark,
          metalness: 0.42,
          roughness: 0.42,
        }),
        charcoal: new THREE.MeshStandardMaterial({
          color: C.charcoal,
          metalness: 0.1,
          roughness: 0.72,
        }),
        dark: new THREE.MeshStandardMaterial({
          color: C.frame,
          metalness: 0.18,
          roughness: 0.62,
        }),
        metal: new THREE.MeshStandardMaterial({
          color: 0xd8dde0,
          metalness: 0.9,
          roughness: 0.25,
        }),
        metalDark: new THREE.MeshStandardMaterial({
          color: 0x7c858f,
          metalness: 0.82,
          roughness: 0.31,
        }),
        cyan: new THREE.MeshStandardMaterial({
          color: 0x8ee9ff,
          emissive: 0x209ac8,
          emissiveIntensity: 2.8,
          metalness: 0.05,
          roughness: 0.28,
        }),
      };

      function roundedBox(width, height, depth, radius, material) {
        const geometry = new RoundedBoxGeometry(width, height, depth, 4, radius);
        const mesh = new THREE.Mesh(geometry, material);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        return mesh;
      }

      function cylinder(radiusTop, radiusBottom, height, segments, material) {
        const mesh = new THREE.Mesh(
          new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments),
          material
        );
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        return mesh;
      }

      function place(mesh, x, y, z, parent = device) {
        mesh.position.set(x, y, z);
        parent.add(mesh);
        return mesh;
      }

      function createRodBetween(start, end, radius, material, parent = device) {
        const direction = new THREE.Vector3().subVectors(end, start);
        const length = direction.length();
        const rod = cylinder(radius, radius, length, 16, material);
        rod.position.copy(start).add(end).multiplyScalar(0.5);
        rod.quaternion.setFromUnitVectors(
          new THREE.Vector3(0, 1, 0),
          direction.clone().normalize()
        );
        parent.add(rod);
        return rod;
      }

      function canvasTexture(canvas) {
        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        return texture;
      }

      // -----------------------------------------------------------------------
      // 箱体建模
      // -----------------------------------------------------------------------
      const base = place(
        roundedBox(25, 8, 18, 1.05, materials.shell),
        0,
        4,
        0
      );
      base.name = "telegraph-base";

      place(roundedBox(24.9, 0.72, 18.15, 0.34, materials.shellDark), 0, 0.62, 0);
      place(roundedBox(24.25, 0.35, 17.25, 0.42, materials.metalDark), 0, 7.98, 0);
      place(roundedBox(23.72, 0.18, 16.68, 0.34, materials.charcoal), 0, 8.2, 0);

      // 顶面细窄装饰线与四角加固包边
      place(roundedBox(23.9, 0.09, 0.28, 0.06, materials.metal), 0, 8.31, -8.02);
      place(roundedBox(23.9, 0.09, 0.28, 0.06, materials.metal), 0, 8.31, 8.02);
      [-11.95, 11.95].forEach((x) => {
        place(roundedBox(0.34, 6.55, 0.34, 0.1, materials.shellDark), x, 4.1, 8.78);
        place(roundedBox(0.34, 6.55, 0.34, 0.1, materials.shellDark), x, 4.1, -8.78);
      });

      // 正面凹槽提手
      place(roundedBox(10.2, 3.05, 0.72, 0.48, materials.dark), 0, 1.75, 9.02);
      place(roundedBox(8.25, 1.62, 0.56, 0.32, materials.shellDark), 0, 1.76, 9.35);
      const handle = cylinder(0.34, 0.34, 7.1, 24, materials.metal);
      handle.rotation.z = Math.PI / 2;
      place(handle, 0, 1.78, 9.67);

      // 青色前沿灯条
      place(roundedBox(8.8, 0.46, 0.13, 0.11, materials.cyan), 0, 4.55, 9.08);
      place(roundedBox(9.45, 0.17, 0.09, 0.04, materials.dark), 0, 4.55, 9.045);

      // -----------------------------------------------------------------------
      // 上盖与屏幕
      // -----------------------------------------------------------------------
      const lidGroup = new THREE.Group();
      lidGroup.position.set(0, 8, -9);
      lidGroup.rotation.x = THREE.MathUtils.degToRad(-100);
      device.add(lidGroup);

      const lidShell = place(
        roundedBox(25, 5.5, 18, 1.02, materials.shell),
        0,
        2.75,
        9,
        lidGroup
      );
      lidShell.name = "telegraph-lid";

      place(roundedBox(24.5, 0.42, 17.5, 0.32, materials.shellDark), 0, 0.08, 9, lidGroup);
      place(roundedBox(23.1, 0.28, 16.3, 0.48, materials.frame), 0, -0.19, 9, lidGroup);
      place(roundedBox(21.75, 0.12, 14.38, 0.26, materials.dark), 0, -0.37, 9, lidGroup);

      const hinge = cylinder(0.62, 0.62, 21.9, 24, materials.metalDark);
      hinge.rotation.z = Math.PI / 2;
      hinge.position.set(0, 0, 0);
      lidGroup.add(hinge);

      const screenCanvas = document.createElement("canvas");
      screenCanvas.width = 1024;
      screenCanvas.height = 640;
      const screenContext = screenCanvas.getContext("2d");
      const screenTexture = canvasTexture(screenCanvas);
      const screenMaterial = new THREE.MeshBasicMaterial({
        map: screenTexture,
        toneMapped: false,
      });
      const screen = new THREE.Mesh(new THREE.PlaneGeometry(20.9, 13.45), screenMaterial);
      screen.rotation.x = Math.PI / 2;
      screen.position.set(0, -0.445, 9);
      lidGroup.add(screen);

      const screenGlass = new THREE.Mesh(
        new THREE.PlaneGeometry(21.3, 13.85),
        new THREE.MeshPhysicalMaterial({
          color: 0xffffff,
          roughness: 0.13,
          metalness: 0,
          transparent: true,
          opacity: 0.08,
          clearcoat: 1,
          clearcoatRoughness: 0.1,
          side: THREE.DoubleSide,
          depthWrite: false,
        })
      );
      screenGlass.rotation.x = Math.PI / 2;
      screenGlass.position.set(0, -0.47, 9);
      lidGroup.add(screenGlass);

      const glowCanvas = document.createElement("canvas");
      glowCanvas.width = 256;
      glowCanvas.height = 256;
      const glowContext = glowCanvas.getContext("2d");
      const glowGradient = glowContext.createRadialGradient(128, 128, 0, 128, 128, 128);
      glowGradient.addColorStop(0, "rgba(79,195,247,0.84)");
      glowGradient.addColorStop(0.42, "rgba(79,195,247,0.26)");
      glowGradient.addColorStop(1, "rgba(79,195,247,0)");
      glowContext.fillStyle = glowGradient;
      glowContext.fillRect(0, 0, 256, 256);
      const glow = new THREE.Sprite(
        new THREE.SpriteMaterial({
          map: canvasTexture(glowCanvas),
          color: C.screen,
          transparent: true,
          opacity: 0.17,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        })
      );
      glow.scale.set(30, 24, 1);
      glow.position.set(0, -1.1, 9);
      lidGroup.add(glow);

      const screenLight = new THREE.PointLight(C.screen, 21, 22, 2);
      screenLight.position.set(0, -2.1, 9);
      lidGroup.add(screenLight);

      [-11.55, 11.55].forEach((x) => {
        place(roundedBox(0.56, 5.1, 15.7, 0.28, materials.shellDark), x, 2.62, 9, lidGroup);
        place(roundedBox(0.92, 0.62, 1.05, 0.18, materials.metalDark), x, 0.16, 16.5, lidGroup);
      });

      // 左右支撑杆
      createRodBetween(
        new THREE.Vector3(-11.55, 8.15, -7.2),
        new THREE.Vector3(-11.8, 15.7, -11.8),
        0.27,
        materials.metal
      );
      createRodBetween(
        new THREE.Vector3(11.55, 8.15, -7.2),
        new THREE.Vector3(11.8, 15.7, -11.8),
        0.27,
        materials.metal
      );

      // -----------------------------------------------------------------------
      // 按钮与电键
      // -----------------------------------------------------------------------
      const interactive = [];
      const buttonCaps = new Map();
      const buttonVisual = new Map([
        ["clear", 0],
        ["send", 0],
      ]);

      function createButtonLabels(zh, en) {
        const canvas = document.createElement("canvas");
        canvas.width = 640;
        canvas.height = 560;
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#f5f7f8";
        ctx.shadowColor = "rgba(0,0,0,0.38)";
        ctx.shadowBlur = 10;
        ctx.shadowOffsetY = 5;
        ctx.font = '700 132px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.fillText(zh, 320, 214);
        ctx.shadowBlur = 4;
        ctx.fillStyle = "#d6dde2";
        ctx.font = '600 68px ui-monospace, SFMono-Regular, Menlo, monospace';
        ctx.fillText(en, 320, 350);
        ctx.fillStyle = "rgba(255,255,255,0.16)";
        ctx.fillRect(204, 410, 232, 3);
        return canvasTexture(canvas);
      }

      function createButton({ x, z, zh, en, action }) {
        const group = new THREE.Group();
        group.position.set(x, 8.43, z);
        device.add(group);

        const frame = roundedBox(7.05, 0.34, 6.45, 0.56, materials.shellDark);
        frame.position.y = -0.1;
        group.add(frame);

        const cap = roundedBox(6.28, 0.76, 5.72, 0.55, materials.charcoal);
        cap.position.y = 0.18;
        group.add(cap);

        const labelTexture = createButtonLabels(zh, en);
        const label = new THREE.Mesh(
          new THREE.PlaneGeometry(5.36, 4.7),
          new THREE.MeshBasicMaterial({
            map: labelTexture,
            transparent: true,
            depthWrite: false,
            alphaTest: 0.01,
            toneMapped: false,
          })
        );
        label.rotation.x = -Math.PI / 2;
        label.position.set(0, 0.6, 0);
        group.add(label);

        cap.userData.action = action;
        label.userData.action = action;
        interactive.push(cap, label);
        buttonCaps.set(action, { cap, label, baseY: cap.position.y });
        return group;
      }

      createButton({
        x: -7.1,
        z: -2.55,
        zh: "清除",
        en: "CLEAR",
        action: "clear",
      });
      createButton({
        x: -4.35,
        z: 3.65,
        zh: "发送",
        en: "SEND",
        action: "send",
      });

      const keyDeck = roundedBox(7.75, 0.38, 9.75, 0.8, materials.charcoal);
      place(keyDeck, 7.15, 8.36, -1.3);

      const keySeat = cylinder(3.25, 3.42, 0.46, 64, materials.metalDark);
      place(keySeat, 7.1, 8.68, -3.5);

      const keyPivot = new THREE.Group();
      keyPivot.position.set(7.05, 9.11, -5.05);
      keyPivot.rotation.x = -0.025;
      device.add(keyPivot);

      const pivotBarrel = cylinder(0.62, 0.62, 3.25, 30, materials.metal);
      pivotBarrel.rotation.z = Math.PI / 2;
      keyPivot.add(pivotBarrel);

      const lever = roundedBox(1.18, 0.4, 5.95, 0.18, materials.metal);
      lever.position.set(0, 0.34, 2.7);
      keyPivot.add(lever);

      const leverNeck = roundedBox(0.76, 0.7, 1.04, 0.28, materials.metalDark);
      leverNeck.position.set(0, 0.78, 4.66);
      keyPivot.add(leverNeck);

      const knob = cylinder(1.12, 1.12, 0.72, 40, materials.charcoal);
      knob.position.set(0, 1.27, 5.36);
      keyPivot.add(knob);

      const knobTop = cylinder(0.75, 0.75, 0.12, 32, materials.metalDark);
      knobTop.position.set(0, 1.69, 5.36);
      keyPivot.add(knobTop);

      // 双压缩弹簧：左右对称支撑杠杆中段，并带导向柱与压座
      const springSet = [];
      const springPressables = [];

      function createCompressionSpring(x) {
        const assembly = new THREE.Group();
        assembly.position.set(x, 8.58, -2.05);
        device.add(assembly);

        const points = [];
        for (let i = 0; i <= 132; i += 1) {
          const t = i / 132;
          const angle = t * Math.PI * 11;
          points.push(
            new THREE.Vector3(
              Math.cos(angle) * 0.31,
              t * 0.64,
              Math.sin(angle) * 0.31
            )
          );
        }

        const springMesh = new THREE.Mesh(
          new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points), 220, 0.052, 8, false),
          materials.metal
        );
        springMesh.castShadow = true;
        assembly.add(springMesh);

        const guide = cylinder(0.1, 0.1, 0.78, 18, materials.metalDark);
        guide.position.y = 0.39;
        assembly.add(guide);

        const bottomSeat = cylinder(0.42, 0.42, 0.1, 28, materials.metalDark);
        bottomSeat.position.y = 0.02;
        assembly.add(bottomSeat);

        const topSeat = cylinder(0.34, 0.34, 0.08, 28, materials.metal);
        topSeat.position.y = 0.67;
        assembly.add(topSeat);

        springSet.push({ springMesh, topSeat });
        springPressables.push(springMesh, guide, bottomSeat, topSeat);
      }

      createCompressionSpring(6.12);
      createCompressionSpring(7.98);

      const springBridge = roundedBox(2.35, 0.11, 0.64, 0.1, materials.metalDark);
      springBridge.position.set(0, 0.11, 3.0);
      keyPivot.add(springBridge);

      const contactBlock = roundedBox(1.28, 0.42, 0.9, 0.18, materials.charcoal);
      contactBlock.position.set(7.05, 8.69, -2.05);
      device.add(contactBlock);
      const contactDot = cylinder(0.38, 0.38, 0.16, 24, materials.metal);
      contactDot.position.set(7.05, 8.93, -2.05);
      device.add(contactDot);

      [
        pivotBarrel,
        lever,
        leverNeck,
        knob,
        knobTop,
        springBridge,
        ...springPressables,
        contactBlock,
        contactDot,
      ].forEach((part) => {
        part.userData.action = "key";
        interactive.push(part);
      });

      // -----------------------------------------------------------------------
      // 灯光
      // -----------------------------------------------------------------------
      scene.add(new THREE.HemisphereLight(0xeaf6ff, 0x707983, 1.45));
      scene.add(new THREE.AmbientLight(0xc5d6e4, 0.56));

      const keyLight = new THREE.DirectionalLight(0xfff2dd, 3.7);
      keyLight.position.set(-34, 52, 32);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.set(2048, 2048);
      keyLight.shadow.camera.near = 5;
      keyLight.shadow.camera.far = 125;
      keyLight.shadow.camera.left = -38;
      keyLight.shadow.camera.right = 38;
      keyLight.shadow.camera.top = 38;
      keyLight.shadow.camera.bottom = -38;
      keyLight.shadow.bias = -0.00025;
      keyLight.shadow.normalBias = 0.025;
      scene.add(keyLight);

      const fillLight = new THREE.DirectionalLight(0xa9d6ff, 1.85);
      fillLight.position.set(38, 22, -30);
      scene.add(fillLight);

      const rimLight = new THREE.DirectionalLight(0xdff7ff, 1.18);
      rimLight.position.set(-6, 20, -38);
      scene.add(rimLight);

      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(180, 180),
        new THREE.ShadowMaterial({ color: 0x314254, opacity: 0.2 })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = -0.04;
      ground.receiveShadow = true;
      scene.add(ground);

      // -----------------------------------------------------------------------
      // 屏幕绘制与交互状态
      // -----------------------------------------------------------------------
      const signals = [];
      const MAX_SIGNALS = 22;
      let keyHeld = false;
      let pressStartedAt = 0;
      let sendFlashUntil = 0;
      let clearFlashUntil = 0;
      let keyPulseUntil = 0;
      let lastScreenDraw = 0;
      let pointerAction = null;

      function signalString() {
        return signals.length
          ? signals.map((signal) => (signal === "dot" ? "·" : "−")).join(" ")
          : "";
      }

      function updateReadout() {
        signalText.textContent = signalString();
      }

      function drawScreen(now) {
        const width = screenCanvas.width;
        const height = screenCanvas.height;
        const ctx = screenContext;
        const sending = now < sendFlashUntil;
        const clearing = now < clearFlashUntil;

        const background = ctx.createLinearGradient(0, 0, width, height);
        background.addColorStop(0, "#081423");
        background.addColorStop(0.52, "#0a1628");
        background.addColorStop(1, "#07111e");
        ctx.fillStyle = background;
        ctx.fillRect(0, 0, width, height);

        const vignette = ctx.createRadialGradient(
          width / 2,
          height / 2,
          80,
          width / 2,
          height / 2,
          650
        );
        vignette.addColorStop(0, "rgba(79,195,247,0.08)");
        vignette.addColorStop(1, "rgba(0,0,0,0.38)");
        ctx.fillStyle = vignette;
        ctx.fillRect(0, 0, width, height);

        // 屏幕只显示当前电报报文
        const line = signalString();
        let fontSize = line.length > 28 ? 68 : line.length > 16 ? 92 : 132;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#f5fbff";
        ctx.shadowColor = "#4fc3f7";
        ctx.shadowBlur = 22;
        ctx.font = `700 ${fontSize}px Georgia, "Times New Roman", serif`;
        while (ctx.measureText(line).width > width - 100 && fontSize > 38) {
          fontSize -= 4;
          ctx.font = `700 ${fontSize}px Georgia, "Times New Roman", serif`;
        }
        ctx.fillText(line, width / 2, height / 2 + 4);
        ctx.shadowBlur = 0;

        if (sending) {
          const flash = 0.08 + 0.06 * Math.sin(now * 0.03);
          ctx.fillStyle = `rgba(181,238,255,${Math.max(0.035, flash)})`;
          ctx.fillRect(0, 0, width, height);
        }

        if (clearing) {
          ctx.fillStyle = "rgba(79,195,247,0.12)";
          ctx.fillRect(0, 0, width, height);
        }

        screenTexture.needsUpdate = true;
      }

      function pressKey() {
        if (keyHeld) return;
        keyHeld = true;
        pressStartedAt = performance.now();
      }

      function releaseKey() {
        if (!keyHeld) return;
        keyHeld = false;
        const duration = performance.now() - pressStartedAt;
        signals.push(duration < 180 ? "dot" : "dash");
        if (signals.length > MAX_SIGNALS) signals.shift();
        updateReadout();
      }

      function triggerClear() {
        signals.length = 0;
        clearFlashUntil = performance.now() + 680;
        buttonVisual.set("clear", 1);
        updateReadout();
      }

      function triggerSend() {
        const now = performance.now();
        sendFlashUntil = now + 900;
        keyPulseUntil = now + 240;
        buttonVisual.set("send", 1);
      }

      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();

      function pointerActionAt(event) {
        const rect = renderer.domElement.getBoundingClientRect();
        pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hit = raycaster.intersectObjects(interactive, false)[0];
        if (!hit) return null;
        let target = hit.object;
        while (target && !target.userData.action) target = target.parent;
        return target ? target.userData.action : null;
      }

      renderer.domElement.addEventListener("pointermove", (event) => {
        if (pointerAction) return;
        const action = pointerActionAt(event);
        renderer.domElement.style.cursor = action ? "pointer" : "default";
      });

      renderer.domElement.addEventListener("pointerdown", (event) => {
        const action = pointerActionAt(event);
        if (!action) return;
        pointerAction = action;
        renderer.domElement.setPointerCapture?.(event.pointerId);
        if (action === "key") {
          pressKey();
        } else {
          buttonVisual.set(action, 1);
        }
      });

      window.addEventListener("pointerup", () => {
        if (!pointerAction) return;
        const action = pointerAction;
        pointerAction = null;
        if (action === "key") {
          releaseKey();
        } else if (action === "clear") {
          triggerClear();
        } else if (action === "send") {
          triggerSend();
        }
      });

      window.addEventListener("pointercancel", () => {
        if (pointerAction === "key") releaseKey();
        pointerAction = null;
      });

      window.addEventListener("keydown", (event) => {
        if (event.key !== "0" && event.code !== "Digit0" && event.code !== "Numpad0") {
          return;
        }
        event.preventDefault();
        if (!event.repeat) pressKey();
      });

      window.addEventListener("keyup", (event) => {
        if (event.key !== "0" && event.code !== "Digit0" && event.code !== "Numpad0") {
          return;
        }
        event.preventDefault();
        releaseKey();
      });

      // -----------------------------------------------------------------------
      // 动画循环
      // -----------------------------------------------------------------------
      function animate() {
        requestAnimationFrame(animate);
        const now = performance.now();
        const delta = Math.min(clock.getDelta(), 0.05);

        const keyTarget = keyHeld || now < keyPulseUntil ? 0.2 : -0.025;
        keyPivot.rotation.x += (keyTarget - keyPivot.rotation.x) * Math.min(1, delta * 22);
        const keyTravel = THREE.MathUtils.clamp((keyPivot.rotation.x + 0.025) / 0.225, 0, 1);
        const springCompression = 1 - keyTravel * 0.42;
        springSet.forEach(({ springMesh, topSeat }) => {
          springMesh.scale.y = springCompression;
          topSeat.position.y = 0.67 * springCompression;
        });

        buttonCaps.forEach(({ cap, label, baseY }, action) => {
          const value = buttonVisual.get(action) * 0.2;
          cap.position.y = baseY - value;
          label.position.y = baseY + 0.42 - value;
          buttonVisual.set(action, Math.max(0, buttonVisual.get(action) - delta * 4.2));
        });

        glow.material.opacity = 0.15 + Math.sin(now * 0.0026) * 0.018;
        screenLight.intensity = 19 + Math.sin(now * 0.0022) * 2.2;

        if (now - lastScreenDraw > 30) {
          lastScreenDraw = now;
          drawScreen(now);
        }

        renderer.render(scene, camera);
      }

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      });

      updateReadout();
      drawScreen(performance.now());
      animate();
      requestAnimationFrame(() => loading.classList.add("hidden"));
    } catch (error) {
      console.error(error);
      loading.classList.add("error");
      loading.textContent =
        "电报机加载失败。\n请确认浏览器支持 WebGL，并可访问 Three.js CDN。\n\n" +
        (error instanceof Error ? error.message : String(error));
    }
  </script>
</body>
</html>
